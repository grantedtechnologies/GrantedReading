<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Granted Reading — Account</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green: #3aaa35;
    --green-dark: #2d8a29;
    --green-light: #eaf7e9;
    --ink: #1a1a1a;
    --muted: #6b7280;
    --border: #e5e7eb;
    --bg: #f3f4f6;
    --white: #ffffff;
    --header-h: 108px;
    --radius: 10px;
    --font: 'Nunito', sans-serif;
    --font-body: 'Nunito Sans', sans-serif;
  }

  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
  }

  .topnav {
    height: var(--header-h);
    background: var(--white);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
  }
  .topnav-left { display: flex; align-items: center; gap: 16px; }
  .hamburger {
    background: none; border: none; cursor: pointer;
    display: flex; flex-direction: column; gap: 5px; padding: 4px;
  }
  .hamburger span { display: block; width: 22px; height: 2px; background: var(--ink); border-radius: 2px; }
  .logo-link { display: flex; align-items: center; text-decoration: none; }
  .logo-img { height: 100px; width: auto; display: block; }
  .app-nav { display: flex; align-items: center; gap: 4px; }
  .app-nav-link {
    font-family: var(--font);
    font-size: 14px;
    font-weight: 700;
    color: var(--muted);
    text-decoration: none;
    padding: 8px 14px;
    border-radius: 8px;
    white-space: nowrap;
  }
  .app-nav-link:hover { color: var(--green-dark); background: var(--green-light); }
  .app-nav-link.active { color: var(--green); background: var(--green-light); }
  .topnav-right { display: flex; align-items: center; gap: 12px; }
  .user-name { font-family: var(--font); font-weight: 700; font-size: 14px; text-align: right; color: inherit; text-decoration: none; display: block; }
  .user-role { font-size: 12px; color: var(--muted); text-align: right; }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--green-light); border: 2px solid var(--green);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font); font-weight: 800; font-size: 14px; color: var(--green);
  }

  .page {
    margin: var(--header-h) auto 0;
    padding: 40px 32px 64px;
    max-width: 880px;
    width: 100%;
  }

  .page-title {
    font-family: var(--font);
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 8px;
  }

  .lead {
    font-size: 16px;
    line-height: 1.6;
    color: var(--muted);
    margin-bottom: 28px;
  }

  .card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px 26px 26px;
    margin-bottom: 18px;
  }

  h2 {
    font-family: var(--font);
    font-size: 20px;
    font-weight: 800;
    margin-bottom: 6px;
  }

  .hint { font-size: 13px; color: var(--muted); margin-bottom: 16px; line-height: 1.5; }

  .field { margin-bottom: 14px; }
  label {
    display: block;
    font-family: var(--font);
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 6px;
  }

  input, select, textarea {
    width: 100%;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: var(--font-body);
    font-size: 15px;
    background: var(--white);
  }
  textarea { min-height: 74px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--green); }
  input:disabled {
    background: var(--bg);
    color: var(--muted);
  }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .plan-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .plan-card {
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 12px 10px;
    cursor: pointer;
    text-align: center;
    background: var(--bg);
    font-family: inherit;
    color: inherit;
    width: 100%;
  }
  .plan-card.selected { border-color: var(--green); background: var(--green-light); }
  .plan-card input { display: none; }
  .plan-name { font-family: var(--font); font-weight: 800; font-size: 14px; }
  .plan-price { font-size: 13px; color: var(--muted); margin-top: 4px; }

  .submit {
    border: none;
    border-radius: 8px;
    background: var(--green);
    color: white;
    font-family: var(--font);
    font-weight: 800;
    font-size: 14px;
    padding: 10px 16px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
  }
  .submit:hover { background: var(--green-dark); }
  .submit:disabled { opacity: 0.7; cursor: wait; }

  .status { font-size: 13px; min-height: 18px; margin-top: 8px; }
  .status.error { color: #b42318; }
  .status.ok { color: var(--green-dark); }

  .student {
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    background: var(--bg);
    margin-bottom: 12px;
  }
  .student h3 {
    font-family: var(--font);
    font-size: 16px;
    font-weight: 800;
    margin-bottom: 4px;
  }
  .meta { font-size: 13px; color: var(--muted); margin-bottom: 10px; }

  .list-block {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
  }
  .list-name { font-family: var(--font); font-weight: 800; font-size: 14px; }
  .words { font-size: 13px; color: var(--muted); margin: 4px 0 10px; }

  .inline { display: flex; gap: 8px; }
  .inline input { flex: 1; }
  .empty { font-size: 14px; color: var(--muted); }

  @media (max-width: 700px) {
    .row { grid-template-columns: 1fr; }
    .page { padding: 28px 16px 48px; }
  }
</style>
</head>
<body>
{% include '_nav.html' %}

<main class="page">
  <h1 class="page-title">Account</h1>
  <p class="lead">Update your name and plan.</p>

  <section class="card">
    <h2>Your profile</h2>
    <p class="hint">Email and password stay the same here.</p>
    <form id="profile-form">
      <div class="row">
        <div class="field">
          <label for="first-name">First name</label>
          <input id="first-name" name="first_name" autocomplete="given-name" />
        </div>
        <div class="field">
          <label for="last-name">Last name</label>
          <input id="last-name" name="last_name" autocomplete="family-name" />
        </div>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" disabled />
      </div>
      <button class="submit" type="submit">Save profile</button>
      <div class="status" id="profile-status"></div>
    </form>
  </section>

  <section class="card" id="billing-card" hidden>
    <h2>Plan</h2>
    <p class="hint" id="billing-hint">Pro is billed on Stripe.</p>
    <div class="plan-grid">
      <button type="button" class="plan-card" id="plan-standard">
        <div class="plan-name">Standard</div>
        <div class="plan-price">Free · 1 worksheet a day</div>
      </button>
      <button type="button" class="plan-card" id="plan-pro">
        <div class="plan-name">Pro</div>
        <div class="plan-price" id="plan-pro-price">$5.99 · unlimited worksheets</div>
      </button>
    </div>
    <div class="status" id="billing-status"></div>
  </section>
</main>

<script>
  function setStatus(id, message, ok) {
    const el = document.getElementById(id);
    el.textContent = message || "";
    el.className = "status " + (ok ? "ok" : "error");
  }

  async function send(url, body) {
    try {
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      });
      const data = await response.json();
      if (!response.ok) {
        return { ok: false, error: data.error || "Could not save that." };
      }
      return { ok: true, data };
    } catch (err) {
      return { ok: false, error: "Could not reach the server." };
    }
  }

  async function loadAccount() {
    const response = await fetch("/api/account");
    if (response.status === 401) {
      window.location.href = "/login";
      return;
    }
    const data = await response.json();
    const teacher = data.teacher || {};
    document.getElementById("first-name").value = teacher.first_name || "";
    document.getElementById("last-name").value = teacher.last_name || "";
    document.getElementById("email").value = teacher.email || "";
    const nameEl = document.querySelector(".user-name");
    if (nameEl && teacher.first_name) {
      nameEl.textContent = `${teacher.first_name} ${teacher.last_name}`;
    }
    renderBilling(data.billing);
    if (billingResult === "success") {
      const onPro = data.billing && data.billing.is_pro;
      setStatus(
        "billing-status",
        onPro ? "You're on Pro." : "Payment received, but the plan has not updated yet. Refresh this page.",
        !!onPro,
      );
    }
  }

  let currentBilling = null;

  function renderBilling(billing) {
    const card = document.getElementById("billing-card");
    card.hidden = !billing;
    currentBilling = billing;
    if (!billing) return;
    const price = (billing.price_cents / 100).toFixed(2);
    document.getElementById("plan-pro-price").textContent = `$${price} · unlimited worksheets`;
    document.getElementById("plan-standard").classList.toggle("selected", !billing.is_pro);
    document.getElementById("plan-pro").classList.toggle("selected", !!billing.is_pro);
    document.getElementById("billing-hint").textContent = billing.is_pro
      ? `You are on ${billing.plan_name}. Choose Standard to cancel on Stripe.`
      : `Choose ${billing.plan_name} to subscribe for $${price} a ${billing.interval}.`;
  }

  async function choosePlan(wantPro, button) {
    if (!currentBilling || wantPro === !!currentBilling.is_pro) return;
    const url = wantPro ? "/billing/create-checkout-session" : "/billing/create-portal-session";
    if (!wantPro && !currentBilling.can_manage) return;
    button.disabled = true;
    const response = await send(url, {});
    if (response.ok && response.data.url) {
      window.location.href = response.data.url;
      return;
    }
    button.disabled = false;
    setStatus("billing-status", response.error, false);
  }

  document.getElementById("plan-standard").addEventListener("click", (event) => {
    choosePlan(false, event.currentTarget);
  });
  document.getElementById("plan-pro").addEventListener("click", (event) => {
    choosePlan(true, event.currentTarget);
  });

  const billingResult = new URLSearchParams(window.location.search).get("billing");
  if (billingResult === "canceled") {
    setStatus("billing-status", "Checkout was canceled. You were not charged.", false);
  }

  document.getElementById("profile-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const btn = event.target.querySelector(".submit");
    btn.disabled = true;
    const response = await send("/api/account", {
      first_name: document.getElementById("first-name").value,
      last_name: document.getElementById("last-name").value,
    });
    btn.disabled = false;
    setStatus("profile-status", response.ok ? "Saved." : response.error, response.ok);
    if (response.ok) await loadAccount();
  });

  loadAccount();
</script>
</body>
</html>
