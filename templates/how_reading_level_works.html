<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Granted Reading — Tutorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green:        #3aaa35;
    --green-dark:   #2d8a29;
    --green-light:  #eaf7e9;
    --ink:          #1a1a1a;
    --muted:        #6b7280;
    --border:       #e5e7eb;
    --bg:           #f3f4f6;
    --white:        #ffffff;
    --header-h:     108px;
    --font:         'Nunito', sans-serif;
    --font-body:    'Nunito Sans', sans-serif;
  }

  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  .topnav {
    height: var(--header-h);
    background: var(--white);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
  }

  .topnav-left { display: flex; align-items: center; gap: 16px; }
  .hamburger {
    background: none; border: none; cursor: pointer;
    display: flex; flex-direction: column; gap: 5px; padding: 4px;
  }
  .hamburger span { display: block; width: 22px; height: 2px; background: var(--ink); border-radius: 2px; }
  .logo-link { display: flex; align-items: center; text-decoration: none; }
  .logo-img { height: 100px; width: auto; display: block; }
  .topnav-right { display: flex; align-items: center; gap: 12px; }
  .user-name { font-family: var(--font); font-weight: 700; font-size: 14px; text-align: right; color: inherit; text-decoration: none; display: block; }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%;
    background: var(--green-light); border: 2px solid var(--green);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font); font-weight: 800; font-size: 14px; color: var(--green);
  }

  .page {
    margin: var(--header-h) auto 0;
    padding: 32px 24px 56px;
    max-width: 1100px;
    width: 100%;
  }

  .page-title {
    font-family: var(--font);
    font-size: 28px;
    font-weight: 800;
    margin-bottom: 8px;
  }

  .lead {
    font-size: 16px;
    line-height: 1.55;
    color: var(--muted);
    margin-bottom: 24px;
  }

  .video-card {
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px;
  }

  .video-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 10px;
    overflow: hidden;
  }

  .video-wrap iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
  }

  @media (max-width: 700px) {
    .page { padding: 24px 16px 48px; }
    .page-title { font-size: 24px; }
    .video-card { padding: 10px; }
  }
</style>
{% include '_posthog.html' %}
</head>
<body>

{% include '_nav.html' %}

<div class="page">
  <h1 class="page-title">Tutorial</h1>
  <p class="lead">Watch this walkthrough of Granted Reading.</p>

  <div class="video-card">
    <div class="video-wrap">
      <iframe
        src="https://www.youtube.com/embed/-8hENQiQya4"
        title="Granted Reading tutorial"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowfullscreen
        referrerpolicy="strict-origin-when-cross-origin"
      ></iframe>
    </div>
  </div>
</div>

</body>
</html>
