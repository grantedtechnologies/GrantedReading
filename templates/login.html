<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Granted Reading — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green: #3aaa35;
    --green-dark: #2d8a29;
    --green-light: #eaf7e9;
    --ink: #1a1a1a;
    --muted: #6b7280;
    --border: #e5e7eb;
    --bg: #f3f4f6;
    --white: #ffffff;
    --font: 'Nunito', sans-serif;
    --font-body: 'Nunito Sans', sans-serif;
  }

  body {
    font-family: var(--font-body);
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 460px;
    background: var(--white);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 28px 28px 32px;
  }

  .logo {
    display: block;
    width: 100%;
    max-width: 380px;
    height: auto;
    margin: 0 auto 8px;
  }

  h1 {
    font-family: var(--font);
    font-size: 22px;
    text-align: center;
    margin-bottom: 18px;
  }

  .mode-nav {
    display: flex;
    gap: 6px;
    background: var(--bg);
    border-radius: 10px;
    padding: 4px;
    margin-bottom: 20px;
  }

  .mode-nav button {
    flex: 1;
    border: none;
    background: transparent;
    font-family: var(--font);
    font-weight: 700;
    font-size: 14px;
    color: var(--muted);
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
  }

  .mode-nav button.active {
    background: var(--white);
    color: var(--green);
  }

  .field { margin-bottom: 14px; }

  label {
    display: block;
    font-family: var(--font);
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 6px;
  }

  input {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-family: var(--font-body);
    font-size: 15px;
  }

  input:focus {
    outline: none;
    border-color: var(--green);
  }

  .hidden { display: none; }

  .error {
    color: #b42318;
    font-size: 13px;
    min-height: 18px;
    margin-bottom: 10px;
  }

  .note {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.5;
    text-align: center;
    margin-bottom: 16px;
  }

  .submit {
    width: 100%;
    border: none;
    border-radius: 8px;
    background: var(--green);
    color: white;
    font-family: var(--font);
    font-weight: 800;
    font-size: 15px;
    padding: 12px;
    cursor: pointer;
  }

  .submit:hover { background: var(--green-dark); }
  .submit:disabled { opacity: 0.7; cursor: wait; }

  .plan-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .plan-card {
    border: 1.5px solid var(--border);
    border-radius: 10px;
    padding: 12px 10px;
    cursor: pointer;
    text-align: center;
    background: var(--bg);
  }
  .plan-card.selected { border-color: var(--green); background: var(--green-light); }
  .plan-card input { display: none; }
  .plan-name { font-family: var(--font); font-weight: 800; font-size: 14px; }
  .plan-price { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .plan-note { font-size: 12px; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/static/logo.png?v=2" alt="Granted Reading" />
    <h1 id="heading">Create an account</h1>

    <div class="mode-nav" id="mode-nav">
      <button type="button" id="tab-signin">Sign in</button>
      <button type="button" id="tab-signup" class="active">Sign up</button>
    </div>

    <form id="auth-form">
      <div id="name-fields">
        <div class="field">
          <label for="first-name">First name</label>
          <input id="first-name" name="first_name" autocomplete="given-name" />
        </div>
        <div class="field">
          <label for="last-name">Last name</label>
          <input id="last-name" name="last_name" autocomplete="family-name" />
        </div>
      </div>
      <div class="field">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <p class="note hidden" id="password-hint">Use at least one letter, one number, and one symbol.</p>
      </div>
      <div class="field hidden" id="confirm-field">
        <label for="confirm-password">Re-enter password</label>
        <input id="confirm-password" name="confirm_password" type="password" autocomplete="new-password" />
      </div>
      <div id="plan-fields" class="field">
        <label>Plan</label>
        <div class="plan-grid">
          <label class="plan-card selected" id="plan-standard">
            <input type="radio" name="membership" value="standard" checked />
            <div class="plan-name">Standard</div>
            <div class="plan-price">Free</div>
            <div class="plan-note">1 worksheet a day</div>
          </label>
          <label class="plan-card" id="plan-pro">
            <input type="radio" name="membership" value="pro" />
            <div class="plan-name">Pro</div>
            <div class="plan-price">$5.99</div>
            <div class="plan-note">Unlimited worksheets</div>
          </label>
        </div>
        <p class="note">Pro goes to payment first. The confirmation email comes after that.</p>
      </div>
      <div class="error" id="error"></div>
      <button class="submit{% if not resume_checkout %} hidden{% endif %}" id="resume-checkout" type="button">Continue to payment</button>
      <button class="submit" id="submit" type="submit">Sign up</button>
    </form>

    <div id="check-email" class="hidden">
      <p class="note" id="check-email-note">Check your inbox for a confirmation link. It expires in 24 hours.</p>
      <div class="error" id="resend-error"></div>
      <button class="submit" id="resend-btn" type="button">Resend email</button>
    </div>
  </div>

<script>
  let mode = {{ (initial_mode or "signup")|tojson }};
  let pendingEmail = "";

  function setMode(next) {
    mode = next;
    const signingUp = mode === "signup";
    document.getElementById("check-email").classList.add("hidden");
    document.getElementById("auth-form").classList.remove("hidden");
    document.getElementById("mode-nav").classList.remove("hidden");
    document.getElementById("tab-signin").classList.toggle("active", !signingUp);
    document.getElementById("tab-signup").classList.toggle("active", signingUp);
    document.getElementById("name-fields").classList.toggle("hidden", !signingUp);
    document.getElementById("plan-fields").classList.toggle("hidden", !signingUp);
    document.getElementById("confirm-field").classList.toggle("hidden", !signingUp);
    document.getElementById("password-hint").classList.toggle("hidden", !signingUp);
    document.getElementById("password").autocomplete = signingUp ? "new-password" : "current-password";
    document.getElementById("heading").textContent = signingUp ? "Create an account" : "Sign in";
    document.getElementById("submit").textContent = signingUp ? "Sign up" : "Sign in";
    document.getElementById("error").textContent = "";
  }

  function showCheckEmail(email) {
    pendingEmail = email;
    document.getElementById("auth-form").classList.add("hidden");
    document.getElementById("mode-nav").classList.add("hidden");
    document.getElementById("check-email").classList.remove("hidden");
    document.getElementById("heading").textContent = "Check your email";
    document.getElementById("check-email-note").textContent =
      `We sent a confirmation link to ${email}. It expires in 24 hours.`;
  }

  document.querySelectorAll('input[name="membership"]').forEach((input) => {
    input.addEventListener("change", () => {
      document.getElementById("plan-standard").classList.toggle(
        "selected",
        document.querySelector('input[name="membership"][value="standard"]').checked
      );
      document.getElementById("plan-pro").classList.toggle(
        "selected",
        document.querySelector('input[name="membership"][value="pro"]').checked
      );
    });
  });

  document.getElementById("tab-signin").addEventListener("click", () => setMode("signin"));
  document.getElementById("tab-signup").addEventListener("click", () => setMode("signup"));
  setMode(mode);

  {% if show_check_email %}
  showCheckEmail({{ pending_email|tojson }});
  {% if email_send_failed %}
  document.getElementById("resend-error").textContent =
    "We could not send the confirmation email. Click Resend to try again. Your account is not verified yet.";
  {% endif %}
  {% endif %}
  {% if billing_canceled %}
  document.getElementById("error").textContent = "Checkout was canceled. You were not charged.";
  {% endif %}
  {% if verify_error %}
  document.getElementById("error").textContent = "That confirmation link is invalid or expired. Sign in to send a new one.";
  {% endif %}

  document.getElementById("resume-checkout").addEventListener("click", async () => {
    const error = document.getElementById("error");
    const button = document.getElementById("resume-checkout");
    button.disabled = true;
    try {
      const response = await fetch("/signup/checkout", { method: "POST" });
      const data = await response.json();
      if (data.checkout_url) {
        window.location.href = data.checkout_url;
        return;
      }
      error.textContent = data.error || "Could not open checkout.";
    } catch (err) {
      error.textContent = "Could not reach the server.";
    } finally {
      button.disabled = false;
    }
  });

  document.getElementById("resend-btn").addEventListener("click", async () => {
    const error = document.getElementById("resend-error");
    const btn = document.getElementById("resend-btn");
    error.textContent = "";
    btn.disabled = true;
    try {
      const response = await fetch("/resend-verification", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: pendingEmail }),
      });
      const data = await response.json();
      if (!response.ok || data.email_sent === false) {
        error.style.color = "";
        error.textContent = data.error || "Could not send that email. Try again.";
        return;
      }
      error.style.color = "var(--green-dark)";
      error.textContent = "Sent again. Check your inbox.";
    } catch (err) {
      error.textContent = "Could not reach the server.";
    } finally {
      btn.disabled = false;
    }
  });

  document.getElementById("auth-form").addEventListener("submit", async (event) => {
    event.preventDefault();
    const error = document.getElementById("error");
    const submit = document.getElementById("submit");
    error.textContent = "";

    const email = document.getElementById("email").value.trim();
    const payload = {
      email,
      password: document.getElementById("password").value,
    };
    if (mode === "signup") {
      const password = payload.password;
      const confirmPassword = document.getElementById("confirm-password").value;
      if (!/[A-Za-z]/.test(password) || !/[0-9]/.test(password) || !/[^A-Za-z0-9]/.test(password)) {
        error.textContent = "Password needs a letter, a number, and a symbol.";
        return;
      }
      if (password !== confirmPassword) {
        error.textContent = "Those passwords do not match.";
        return;
      }
      payload.first_name = document.getElementById("first-name").value.trim();
      payload.last_name = document.getElementById("last-name").value.trim();
      payload.password_confirm = confirmPassword;
      payload.membership = document.querySelector('input[name="membership"]:checked').value;
    }

    submit.disabled = true;
    try {
      const response = await fetch(mode === "signup" ? "/signup" : "/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload),
      });
      const data = await response.json();
      if (data.checkout_url) {
        window.location.href = data.checkout_url;
        return;
      }
      if (data.email_sent && data.needs_verification) {
        showCheckEmail(email);
        return;
      }
      if (!response.ok) {
        error.textContent = data.error || "Could not complete that.";
        return;
      }
      if (data.needs_verification) {
        error.textContent = data.error || "We could not send the confirmation email. Try again.";
        return;
      }
      window.location.href = data.redirect || "/worksheet";
    } catch (err) {
      error.textContent = "Could not reach the server.";
    } finally {
      submit.disabled = false;
    }
  });
</script>
</body>
</html>
